server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Block hidden files such as /.env or /.git - bots scan for these.
    location ~ /\. {
        deny all;
        return 404;
    }

    location /api/ {
        # Docker's internal DNS. Using a variable in proxy_pass makes nginx
        # look up "backend" again (every 10s) instead of only once at startup,
        # so a backend redeploy that changes its IP no longer causes 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;

        # Same behaviour as before: /api/auth/login -> /auth/login
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}