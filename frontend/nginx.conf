server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS, CSS, JSON) - pages load noticeably faster.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic security headers. NOTE: nginx drops these inside any location that
    # has its own add_header, so they are repeated in /assets/ and / below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block hidden files such as /.env or /.git - bots scan for these.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Built JS/CSS files. Their names change on every deploy
    # (index-Cru0lo3C.js), so they can be cached for a long time.
    # A missing one must be a real 404 - never index.html served as
    # JavaScript, which blanks the page in a browser holding an old copy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        # Docker's internal DNS. Using a variable in proxy_pass makes nginx
        # look up "backend" again (every 10s) instead of only once at startup,
        # so a backend redeploy that changes its IP no longer causes 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;

        # Same behaviour as before: /api/auth/login -> /auth/login
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # API data must never be served from a browser or proxy cache.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Backend down or restarting: answer with a short JSON message the app
        # can show ("Server is restarting...") instead of a raw nginx HTML page.
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"The server is restarting or unavailable. Please try again in a minute."}';
    }

    # The app page itself: browsers must re-check it every time, so after a
    # deploy every browser picks up the new file names straight away.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}